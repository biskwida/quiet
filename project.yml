name: Quiet
options:
  bundleIdPrefix: local.quiet
  deploymentTarget:
    iOS: "17.0"
packages:
  QuietCore:
    path: QuietCore
targets:
  Quiet:
    type: application
    platform: iOS
    sources:
      - path: Quiet
        excludes: ["Web/Injected"]
      - path: Quiet/Web/Injected
        buildPhase: resources
    dependencies:
      - package: QuietCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.quiet.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quiet
        INFOPLIST_KEY_NSCameraUsageDescription: "To take photos and videos you choose to post or send on Instagram."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "To record voice messages and video sound you choose to send on Instagram."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "To keep your messages locked until you open them."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
