name: Build and smoke test

# Started by hand only (Actions tab, or `gh workflow run build.yml`), so pushes never
# spend build minutes on their own.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          which xcodegen || brew install xcodegen

      - name: Rule tests
        run: QuietCore/test.sh

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if 'iOS' in k), reverse=True)
          print(next(d['udid'] for k in runtimes for d in devices[k] if 'iPhone' in d['name']))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Quiet.xcodeproj -scheme Quiet -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build.log | grep -E "error|warning: |BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Launch in simulator
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Quiet.app
          mkdir -p shots

          # 1. Fresh install: the welcome screen.
          xcrun simctl launch "$UDID" local.quiet.app
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/1-welcome.png
          xcrun simctl terminate "$UDID" local.quiet.app

          # 2. With a placeholder account (debug builds only): the web view loads Instagram,
          #    which should land on Instagram's own login page. No credentials are involved.
          PID=$(xcrun simctl launch "$UDID" local.quiet.app -QuietDemoAccount demo | awk '{print $NF}')
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/2-account.png
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "local.quiet.app"; then
            echo "App is still running (pid $PID)"
          else
            echo "App is no longer running: it crashed or exited" && exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            shots
            build.log
